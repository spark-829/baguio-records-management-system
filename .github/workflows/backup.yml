name: Nightly backup
on:
  schedule:
    - cron: "0 18 * * *" # 2:00 AM Manila
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rms-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: 2.40.7
      - name: Run backup
        id: backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          SUPABASE_S3_REGION: ${{ secrets.SUPABASE_S3_REGION }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: bash scripts/backup/backup.sh
      - name: Keep encrypted backup as artifact (only when R2 is not set up)
        if: steps.backup.outputs.uploaded == 'false' && steps.backup.outputs.gpg_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: rms-backup-encrypted
          path: |
            ${{ steps.backup.outputs.gpg_path }}
            ${{ steps.backup.outputs.sha_path }}
          retention-days: 7
